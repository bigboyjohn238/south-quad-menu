name: Publish South Quad Menu

on:
  workflow_dispatch:
  push:
    paths:
      - 'scrape.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/south-quad.yml'
  # GitHub cron is UTC, and scheduled jobs can be delayed.
  # Multiple non-hour-boundary attempts before and after 6 AM Detroit time.
  # 09 UTC = 5 AM EDT / 4 AM EST; 10 UTC = 6 AM EDT / 5 AM EST.
  schedule:
    - cron: '7,37 9-12 * * *'
    - cron: '17 13-16 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: south-quad-menu
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate parser
        run: python -m unittest discover -s tests -v
      - name: Fetch verified South Quad menu
        id: scrape
        shell: bash
        run: |
          echo "UTC: $(date -u -Is)"
          TZ=America/Detroit date '+Detroit: %Y-%m-%d %H:%M:%S %Z'
          # Allow the dining website time to publish today's menu.
          for attempt in 1 2 3; do
            if python scrape.py; then
              echo "Scrape succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::Scrape attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep 90; fi
          done
          echo "::error::Unable to retrieve verified menu after three attempts"
          exit 1
      - name: Commit published menu
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/today.json docs/today.md docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish current South Quad menu"
            git push
          fi
      - name: Report failure in GitHub Actions
        if: failure()
        run: |
          echo "::error::Today's menu was not published. See preceding step logs."
          echo "Failure URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
